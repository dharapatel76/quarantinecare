<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuarantineCare | Daily Round</title>
<style>
:root{--ink:#12343b;--ac:#0f766e;--bg:#f3f6f6;--ln:#dde6e6;--mu:#64808061;--tx:#1d2f33;--mt:#5d7478;--rd:#b42318;--am:#a15c07;--gn:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700}.brand small{display:block;font-size:12px;font-weight:400;color:#a9c4c4}
header label{font-size:12px;color:#a9c4c4;margin-right:6px}header select{width:auto;border:0}
.shell{display:grid;grid-template-columns:210px 1fr}aside{background:#fff;border-right:1px solid var(--ln);padding:14px 10px;min-height:calc(100vh - 60px)}
nav button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;color:var(--mt);cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:#e3f2f0;color:var(--ac);font-weight:600}nav b{background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
main{padding:22px;max-width:1300px;width:100%}h1{font-size:23px;margin:0 0 2px;color:var(--ink)}h2{font-size:15px;margin:0 0 10px;color:var(--ink)}.sub{color:var(--mt);margin:0 0 16px}
input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #c5d3d3;border-radius:7px;padding:8px 9px;width:100%;background:#fff;color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{border:0;border-radius:7px;padding:8px 13px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}.btn.s{background:#fff;color:var(--ac);border:1px solid #b5d3cf}.btn.d{background:var(--rd)}.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:15px}.card .n{font-size:28px;font-weight:700;color:var(--ink)}.card .l{color:var(--mt);font-size:13px}.card.hot{border-color:#e9b8b3;background:#fff6f5}
.bar{height:8px;background:#e3ecec;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mt);font-weight:600;padding:8px;border-bottom:1px solid var(--ln)}td{padding:9px 8px;border-bottom:1px solid #edf2f2;vertical-align:middle}.tw{overflow:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:#e8eeee;color:#465f63}.g{background:#dcf3e4;color:var(--gn)}.w{background:#fdf0d5;color:var(--am)}.r{background:#fde4e1;color:var(--rd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid #c5d3d3;background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.al{padding:10px 13px;border-radius:8px;margin:0 0 12px;background:#fdf0d5;color:#6f4204;border:1px solid #f0d9a4}.al.r{background:#fde4e1;color:#8a1c12;border-color:#f1bdb8}.al.g{background:#e3f5ea;color:#116035;border-color:#b9e2c8}
.mb{position:fixed;inset:0;background:#0b222877;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.m{background:#fff;border-radius:12px;padding:20px;width:min(640px,100%);max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h2{margin:0;font-size:18px}.x{border:0;background:#e8eeee;border-radius:50%;width:30px;height:30px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}label.f{display:block;font-size:12px;font-weight:600;color:var(--mt);margin-bottom:4px}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px;margin:6px 0 4px}.spark div{flex:1;background:#7fc4bb;border-radius:3px 3px 0 0;min-width:12px;position:relative}.spark div.f{background:#e5584a}.spark span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--mt)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f2}.mu{color:var(--mt)}.ft{font-size:12px;color:var(--mt);margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90vw}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{min-height:0;border:0;border-bottom:1px solid var(--ln)}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto;gap:8px}main{padding:14px}.fg{grid-template-columns:1fr}table{min-width:640px}}
</style></head><body>
<header><div class="brand">QuarantineCare<small>Daily round: temperatures, doctor visits, discharges</small></div>
<div><label for="role">Demo login</label><select id="role" onchange="setRole()"><option>Nurse</option><option>Doctor</option><option>Admin</option><option>Manager</option></select> <span id="who" class="mu" style="color:#a9c4c4"></span></div></header>
<div class="shell"><aside><nav id="nav"></nav><div class="ft">Sample data only. Not a clinical system.<br><button class="btn s sm" style="margin-top:8px" onclick="resetDemo()">Reset demo data</button></div></aside><main id="app"></main></div>
<div class="mb" id="mb"><div class="m"><div class="mh"><h2 id="mt"></h2><button class="x" aria-label="Close" onclick="closeM()">×</button></div><div id="mbody"></div></div></div><div id="toast" role="status"></div>
<script>
const CAP=74,S={thr:38,days:3};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const T=()=>ymd(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAFF={Nurse:'Priya Nair',Doctor:'Dr. Anil Rao',Admin:'Imran Khan',Manager:'Sunita Kulkarni'};
const PAGES={Nurse:['round','patients'],Doctor:['queue','patients','discharge'],Admin:['overview','admit','discharge','patients'],Manager:['overview','analytics','audit','patients']};
const LBL={round:'Temperature round',queue:'Doctor queue',overview:'Overview',admit:'Admissions',discharge:'Discharge queue',analytics:'Performance',audit:'Audit log',patients:'All patients'};
let D,page,filter='all',q='';
function seed(){let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
 const F='Aarav Mira Kabir Sana Dev Isha Rohan Neha Vikram Anaya Arjun Diya Kiran Tara Rahul Meera Sameer Pooja Nikhil Riya Yash Kavya Aditya Nisha Varun'.split(' '),L='Mehta Shah Rao Iyer Malhotra Nair Gupta Singh Patil Reddy Joshi Khan Das Kapoor Menon Bose Sharma Verma'.split(' ');
 const P=[],ts=()=>(36.4+r()*.9).toFixed(1)*1;
 for(let i=0;i<74;i++){const n=2+Math.floor(r()*9),k=i%5,rd=[];
  for(let a=n;a>=0;a--){let t=ts(),fever=k<2?a<=2||a%2:k==2?a>=4:k==3?a>=1:i%10==4?false:a%3==1;if(fever)t=38.1+Math.floor(r()*14)/10;
   if(a==0&&r()<.45)continue;if(a>0&&a<n&&r()<.06)continue;rd.push({d:ago(a),t,by:'Nurse Priya Nair',at:''})}
  const rec=rd.some(x=>x.d==T());
  P.push({id:'QC-'+(1001+i),name:F[i%25]+' '+L[(i*7)%18],age:22+Math.floor(r()*50),adm:ago(n),st:'Active',rd,vis:rec&&r()<.4?[{d:T(),by:'Dr. Anil Rao',note:'Reviewed. Continue plan.',em:false}]:[]})}
 for(let i=0;i<40;i++)P.push({id:'QC-'+(901+i),name:F[(i*3)%25]+' '+L[(i*5)%18],age:30,adm:ago(20),st:i%7==0?'Deceased':'Discharged',out:ago(1+(i*11)%27),rd:[],vis:[]});
 return{p:P,wait:[{name:'Ritu Pillai',age:39},{name:'Omar Sheikh',age:57}],log:[],next:1075}}
function load(){try{D=JSON.parse(localStorage.getItem('qc2'))}catch(e){}if(!D)D=seed()}
function save(){try{localStorage.setItem('qc2',JSON.stringify(D))}catch(e){}}
const role=()=>document.getElementById('role').value,who=()=>STAFF[role()];
const log=m=>{D.log.unshift({at:new Date().toLocaleString(),who:who(),role:role(),m});D.log=D.log.slice(0,80)};
const act=()=>D.p.filter(p=>p.st=='Active'),tr=p=>p.rd.find(x=>x.d==T()),vd=p=>p.vis.some(v=>v.d==T());
const lastR=p=>p.rd.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t)[0];
function streak(p){const days=[];let d=0;if(!p.rd.some(x=>x.d==T()))d=1;
 for(;d<40;d++){const day=ago(d),rs=p.rd.filter(x=>x.d==day);if(!rs.length||rs.some(x=>x.t>=S.thr))break;days.push({d:day,t:Math.max(...rs.map(x=>x.t))})}
 return days.reverse()}
const elig=p=>streak(p).length>=S.days,fever=p=>{const l=lastR(p);return l&&l.t>=S.thr};
const since=p=>{const s=streak(p);return s.length>=S.days?s[S.days-1].d:null};
const waitDays=p=>{const s=since(p);return s?Math.round((new Date(T())-new Date(s))/864e5):0};
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`,btn=(l,f,c='btn sm')=>`<button class="${c}" onclick="${f}">${l}</button>`;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function openM(t,b){mt.textContent=t;mbody.innerHTML=b;mb.style.display='flex'}function closeM(){mb.style.display='none'}
function setRole(){page=PAGES[role()][0];who_.textContent='· '+who();filter='all';render()}
const who_=document.getElementById('who');
function badge(pg){if(pg=='round')return act().filter(p=>!tr(p)).length;if(pg=='queue')return act().filter(p=>!vd(p)).length;if(pg=='discharge')return act().filter(elig).length;if(pg=='admit')return D.wait.length;return ''}
function render(){const pgs=PAGES[role()];if(!pgs.includes(page))page=pgs[0];
 nav.innerHTML=pgs.map(g=>`<button class="${g==page?'on':''}" onclick="page='${g}';render()">${LBL[g]}${badge(g)?`<b>${badge(g)}</b>`:''}</button>`).join('');
 app.innerHTML=V[page]();who_.textContent='· '+who()}
const H=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const card=(n,l,hot)=>`<div class="card ${hot?'hot':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
function rates(days){const cut=days?ago(days):'';const c=D.p.filter(p=>p.out&&p.out>=cut),dd=c.filter(p=>p.st=='Deceased').length,n=c.length;return{n,dd,rc:n-dd,m:n?dd/n*100:null}}
const V={
overview(){const a=act(),r=rates(0),fv=a.filter(fever).length,el=a.filter(elig).length,tp=a.filter(p=>!tr(p)).length,vp=a.filter(p=>!vd(p)).length;
 return H('Facility overview','Live status of every bed, today’s tasks and discharge readiness.')+(r.m>15?`<div class="al r"><b>Mortality is ${r.m.toFixed(1)}%, above the 15% benchmark</b> (${r.dd} of ${r.n} completed outcomes). Review treatment outcomes.</div>`:'')+
 `<div class="cards">${card(a.length+' / '+CAP,'Beds occupied · '+(CAP-a.length)+' free')}${card(tp,'Temperatures still to take',tp>0)}${card(vp,'Doctor visits pending')}${card(fv,'Latest reading is a fever',fv>0)}${card(el,'Ready for discharge')}</div>
 <div class="panel"><h2>Bed occupancy</h2><div class="bar"><i style="width:${a.length/CAP*100}%"></i></div><p class="mu">${D.wait.length} on the waiting list. ${el} eligible patients are still occupying beds${el?' – process their discharges to free beds.':'.'}</p></div>`},
round(){const a=act().filter(p=>filter=='done'?tr(p):!tr(p)),done=act().length-act().filter(p=>!tr(p)).length;
 return H('Temperature round',`${done} of ${act().length} recorded today. One routine reading per patient per day.`)+`<div class="chips">${['todo','done'].map(f=>`<span class="chip ${(filter=='done'?'done':'todo')==f?'on':''}" onclick="filter='${f}';render()">${f=='todo'?'To take':'Recorded'}</span>`).join('')}</div>
 <div class="panel tw"><table><thead><tr><th>Patient</th><th>Yesterday</th><th>Today’s °C</th><th></th></tr></thead><tbody>${a.map(p=>{const y=p.rd.find(x=>x.d==ago(1)),t=tr(p);return`<tr><td><b>${esc(p.name)}</b><br><span class="mu">${p.id}</span></td><td>${y?y.t.toFixed(1):'—'}</td><td>${t?pill(t.t.toFixed(1)+' ✓',t.t>=S.thr?'r':'g')+`<div id="w${p.id}"></div>`:''}<input id="t${p.id}" type="number" step="0.1" placeholder="e.g. 36.8" style="width:90px;${t?'display:none':''}" onkeydown="if(event.key=='Enter')saveT('${p.id}')"><div id="rs${p.id}" style="display:none"><input id="r${p.id}" placeholder="Reason for repeat reading" style="margin-top:6px"></div></td><td>${t?btn('Repeat reading',`rep('${p.id}')`,'btn s sm'):btn('Save',`saveT('${p.id}')`)}</td></tr>`}).join('')||'<tr><td colspan=4 class="mu">Nothing here.</td></tr>'}</tbody></table></div>`},
queue(){const rank=p=>vd(p)?3:fever(p)&&tr(p)?0:tr(p)?1:2,a=act().sort((x,y)=>rank(x)-rank(y)),rd=a.filter(p=>tr(p)&&!vd(p)).length;
 return H('Doctor queue',`${rd} patients are measured and waiting for you. Patients without today’s reading are listed after them.`)+`<div class="panel tw"><table><thead><tr><th>Patient</th><th>Today</th><th>Streak</th><th>Status</th><th></th></tr></thead><tbody>${a.map(p=>{const t=tr(p);return`<tr><td><b>${esc(p.name)}</b><br><span class="mu">${p.id}</span></td><td>${t?pill(t.t.toFixed(1)+'°C',t.t>=S.thr?'r':'g'):pill('Not measured','w')}</td><td>${streak(p).length}/${S.days}</td><td>${vd(p)?pill('Visited','g'):t?pill('Ready for visit'):pill('Wait for nurse','w')}</td><td>${vd(p)?'':btn(t?'Review':'Emergency visit',`visit('${p.id}')`,t?'btn sm':'btn s sm')}</td></tr>`}).join('')}</tbody></table></div>`},
patients(){const f={all:()=>1,t:p=>!tr(p),v:p=>!vd(p),e:elig,f:fever},a=act().filter(p=>f[filter]?f[filter](p):1).filter(p=>(p.name+p.id).toLowerCase().includes(q.toLowerCase())),c=[['all','All'],['t','No temperature'],['v','No visit'],['e','Eligible'],['f','Fever']];
 return H('Patients','One shared record for every admitted patient.')+`<div class="chips">${c.map(x=>`<span class="chip ${filter==x[0]?'on':''}" onclick="filter='${x[0]}';render()">${x[1]}</span>`).join('')}<input placeholder="Search name or ID" value="${esc(q)}" oninput="q=this.value;render();this.focus()" style="max-width:220px"></div><div class="panel tw"><table><thead><tr><th>Patient</th><th>Admitted</th><th>Latest</th><th>Temp today</th><th>Visit today</th><th>Fever-free</th><th></th></tr></thead><tbody>${a.map(p=>{const l=lastR(p);return`<tr><td><b>${esc(p.name)}</b><br><span class="mu">${p.id} · ${p.age}y</span></td><td>${p.adm}</td><td>${l?l.t.toFixed(1)+'°C':'—'}</td><td>${pill(tr(p)?'Done':'Pending',tr(p)?'g':'w')}</td><td>${pill(vd(p)?'Done':'Pending',vd(p)?'g':'w')}</td><td>${elig(p)?pill('Eligible','g'):streak(p).length+'/'+S.days}</td><td>${btn('Open',`rec('${p.id}')`,'btn s sm')}</td></tr>`}).join('')||'<tr><td colspan=7 class="mu">No matching patients.</td></tr>'}</tbody></table></div>`},
admit(){const a=act().length,full=a>=CAP;return H('Admissions',`${a} of ${CAP} beds occupied.`)+(full?'<div class="al">All beds are full. New patients go to the waiting list until a discharge frees a bed.</div>':'')+
 `<div class="panel"><h2>Register a patient</h2><div class="fg"><div><label class="f" for="nn">Full name</label><input id="nn"></div><div><label class="f" for="na">Age</label><input id="na" type="number" min="0" max="120"></div></div>${btn(full?'Add to waiting list':'Admit patient','reg()','btn')}</div>
 <div class="panel" style="margin-top:14px"><h2>Waiting list (${D.wait.length})</h2>${D.wait.map((w,i)=>`<div class="row"><span><b>${esc(w.name)}</b> <span class="mu">${w.age}y</span></span><button class="btn sm" ${full?'disabled':''} onclick="admitW(${i})">Admit</button></div>`).join('')||'<p class="mu">No one is waiting.</p>'}</div>`},
discharge(){const a=act().filter(p=>elig(p)).sort((x,y)=>waitDays(y)-waitDays(x)),n=act().filter(p=>!elig(p)&&streak(p).length==S.days-1&&!tr(p)==false);
 return H('Discharge queue','Patients appear here automatically after '+S.days+' fever-free days, each with a documented reading. No manual handoff needed.')+`<div class="panel tw"><table><thead><tr><th>Patient</th><th>Evidence</th><th>Waiting</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="mu">${p.id}</span></td><td>${streak(p).slice(-S.days).map(s=>`${s.d.slice(5)}: ${s.t.toFixed(1)}°`).join(' · ')}</td><td>${waitDays(p)?pill(waitDays(p)+' day(s) over',waitDays(p)>1?'r':'w'):pill('Today','g')}</td><td>${role()=='Admin'?btn('Discharge',`dis('${p.id}')`):'<span class="mu">Admin completes</span>'}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">No eligible patients right now.</td></tr>'}</tbody></table></div>`+(role()=='Doctor'?'<p class="ft">Eligibility is calculated from nurse readings. A fever reading resets the count automatically.</p>':'')},
analytics(){const pr=+(window.per??30),r=rates(pr),a=act(),el=a.filter(elig),av=el.length?(el.reduce((s,p)=>s+waitDays(p),0)/el.length).toFixed(1):0;
 return H('Performance','Rates use completed outcomes only (discharged or deceased).')+`<div class="chips">${[[7,'7 days'],[30,'30 days'],[0,'All time']].map(x=>`<span class="chip ${pr==x[0]?'on':''}" onclick="per=${x[0]};render()">${x[1]}</span>`).join('')}</div>`+
 (r.m==null?'<div class="al">Not yet available: no completed outcomes in this period.</div>':r.m>15?`<div class="al r"><b>Mortality is above the 15% benchmark.</b> ${r.dd} deaths out of ${r.n} completed outcomes.</div>`:'<div class="al g">Mortality is within the 15% benchmark.</div>')+
 `<div class="cards">${card(r.m==null?'Not yet available':r.m.toFixed(1)+'%','Mortality · '+r.dd+' of '+r.n+' · benchmark ≤15%',r.m>15)}${card(r.m==null?'Not yet available':(100-r.m).toFixed(1)+'%','Recovery · '+r.rc+' of '+r.n+' · target ≥85%',r.m>15)}${card(el.length,'Eligible, still admitted')}${card(av+' days','Average wait after eligibility')}${card(a.length+' / '+CAP,'Beds occupied')}</div>`},
audit(){return H('Audit log','Who did what and when. Entries are kept, never overwritten.')+`<div class="panel">${D.log.map(l=>`<div class="row"><span>${esc(l.m)}</span><span class="mu">${esc(l.who)} (${l.role}) · ${l.at}</span></div>`).join('')||'<p class="mu">No actions recorded yet in this session.</p>'}</div>`}};
function saveT(id){const p=D.p.find(x=>x.id==id),v=parseFloat(document.getElementById('t'+id).value),old=tr(p);
 if(role()!='Nurse')return toast('Only nurses record temperatures.');
 if(!isFinite(v))return toast('Enter a temperature in °C.');
 if(old){const rs=document.getElementById('r'+id).value.trim();if(!rs){document.getElementById('rs'+id).style.display='block';return toast('A reading exists today. Add a reason to record another.')}}
 if((v<34||v>42)&&!confirm(v+'°C is unusual. Save it anyway?'))return;
 p.rd.push({d:T(),t:v,by:'Nurse '+who(),at:new Date().toLocaleTimeString(),reason:old?document.getElementById('r'+id).value.trim():''});
 log((old?'Repeat reading ':'Reading ')+v.toFixed(1)+'°C for '+p.id);save();render();toast(v>=S.thr?'Fever reading saved. Doctor has been alerted.':'Temperature saved.')}
function rep(id){document.getElementById('t'+id).style.display='';document.getElementById('rs'+id).style.display='block';document.getElementById('w'+id).innerHTML='<div class="mu" style="font-size:12px">Repeat: reason required. Original is kept.</div>'}
function visit(id){const p=D.p.find(x=>x.id==id),t=tr(p);
 openM('Visit: '+p.name,(t?'':'<div class="al">No temperature has been taken today. You can still record an emergency visit with a reason.</div>')+chart(p)+`<label class="f" for="vn">Notes and treatment</label><textarea id="vn" rows="3"></textarea>${t?'':'<label class="f" for="ve" style="margin-top:8px">Why are you visiting before the reading?</label><input id="ve">'}<div style="margin-top:12px;display:flex;gap:8px">${btn('Mark visit complete',`saveV('${id}')`,'btn')}${btn('Record death','death(\''+id+'\')','btn d')}</div>`)}
function saveV(id){const p=D.p.find(x=>x.id==id),n=vn.value.trim(),e=window.ve?ve.value.trim():'';
 if(role()!='Doctor')return toast('Only doctors record visits.');if(!n)return toast('Notes are required.');if(!tr(p)&&!e)return toast('Give a reason for the emergency visit.');
 if(vd(p))return toast('Visit already recorded today.');p.vis.push({d:T(),by:who(),note:n,em:!tr(p),why:e});log('Visit completed for '+p.id+(tr(p)?'':' (emergency, no reading)'));save();closeM();render();toast('Visit recorded.')}
function death(id){const p=D.p.find(x=>x.id==id);if(role()!='Doctor')return;if(!confirm('Record death for '+p.name+'? This frees the bed and updates mortality.'))return;
 p.st='Deceased';p.out=T();log('Outcome recorded: deceased, '+p.id);save();closeM();render();toast('Outcome recorded.')}
function chart(p){const s=p.rd.slice().sort((a,b)=>a.d.localeCompare(b.d)).slice(-7);if(!s.length)return'<p class="mu">No readings yet.</p>';
 return`<div class="spark">${s.map(x=>`<div class="${x.t>=S.thr?'f':''}" style="height:${Math.max(8,(x.t-35)*14)}px" title="${x.d}"><span>${x.t.toFixed(1)}</span></div>`).join('')}</div><div class="mu" style="margin-bottom:10px">Last ${s.length} readings · fever-free streak ${streak(p).length}/${S.days}</div>`}
function rec(id){const p=D.p.find(x=>x.id==id);openM(p.name+' · '+p.id,`<p class="mu">${p.age} years · admitted ${p.adm}</p>${chart(p)}${role()=='Admin'?'':''}<h2>Visits</h2>${p.vis.slice().reverse().map(v=>`<div class="row"><span>${v.note?esc(v.note):''}${v.em?' '+pill('Emergency','w'):''}</span><span class="mu">${v.d} · ${esc(v.by)}</span></div>`).join('')||'<p class="mu">No visits recorded.</p>'}<h2 style="margin-top:12px">Eligibility</h2><p>${elig(p)?'Eligible: '+streak(p).map(s=>s.d.slice(5)+' '+s.t.toFixed(1)+'°').join(', '):'Not yet eligible. Missing days do not count as fever-free.'}</p>`)}
function reg(){if(role()!='Admin')return;const n=nn.value.trim(),a=+na.value;if(!n||!(a>=0&&a<=120)||!na.value)return toast('Enter a name and a valid age.');
 if(D.p.some(x=>x.st=='Active'&&x.name.toLowerCase()==n.toLowerCase()&&x.age==a)||D.wait.some(x=>x.name.toLowerCase()==n.toLowerCase()))return toast('This patient is already registered.');
 if(act().length>=CAP){D.wait.push({name:n,age:a});log('Added '+n+' to waiting list');save();render();return toast('Beds full. Added to waiting list.')}
 adm(n,a);save();render()}
function adm(n,a){const id='QC-'+D.next++;D.p.push({id,name:n,age:a,adm:T(),st:'Active',rd:[],vis:[]});log('Admitted '+id);toast('Admitted as '+id+'. Temperature task added for the nurse.')}
function admitW(i){if(act().length>=CAP)return toast('No free bed.');const w=D.wait.splice(i,1)[0];adm(w.name,w.age);save();render()}
function dis(id){const p=D.p.find(x=>x.id==id);openM('Confirm discharge',`<p><b>${esc(p.name)}</b> · ${p.id}</p><p>${streak(p).slice(-S.days).map(s=>s.d+': '+s.t.toFixed(1)+'°C').join('<br>')}</p><p class="mu">This frees the bed and records a recovery.</p>${btn('Confirm discharge',`doDis('${id}')`,'btn')}`)}
function doDis(id){const p=D.p.find(x=>x.id==id);if(role()!='Admin'||p.st!='Active')return;if(!elig(p)){closeM();render();return toast('Blocked: '+S.days+' fever-free days not met.')}
 p.st='Discharged';p.out=T();log('Discharged '+p.id);save();closeM();render();toast('Discharged. Bed released ('+(CAP-act().length)+' free).')}
function resetDemo(){if(confirm('Restore the original sample data?')){localStorage.removeItem('qc2');load();render();toast('Demo data restored.')}}
load();page='round';render();
</script></body></html>
